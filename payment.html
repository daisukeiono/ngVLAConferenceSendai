<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment | ngVLA Conference Sendai</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="payment-page">
    <section class="payment-card">
      <h1>Payment</h1>

      <p class="payment-note">
        Please enter the same email address you used for registration.
      </p>

      <form action="https://test-payment.alpha-note.co.jp/service/credit" method="post" accept-charset="UTF-8">
        <input type="hidden" name="SiteId" value="22304603">
        <input type="hidden" name="SitePass" value="cawb2473">

        <label for="email">Email</label>
        <input id="email" type="email" name="mail" required placeholder="your.email@example.com">

        <label for="amount">Payment category</label>
        <select id="amount" name="Amount" required>
          <option value="30000">Regular: 30,000 JPY</option>
          <option value="15000">Student: 15,000 JPY</option>
          <option value="5000">Banquet only: 5,000 JPY</option>
        </select>

        <button type="submit" class="payment-button">
          Proceed to Payment
        </button>
      </form>

      <p class="payment-small">
        You will be redirected to the secure payment page.
      </p>
    </section>
  </main>
</body>
</html>
